name: CI

on:
  push:
    branches: [main, legacy]
  pull_request:

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} lint (our code)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.1 is the supported floor (bin/preflight.php gates on it and docs/going-public.md
        # tells deployers to select 8.1+); 8.3 is the tested stack. Linting only 8.3 meant
        # 8.2+ syntax could land and be found by a deployer rather than by CI.
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: php -l across project code (vendored libs excluded)
        run: |
          # bin/ and test/ are first-party PHP that CI already *runs* — bin/preflight.php is the
          # script a deployer executes, and test/*.php is executed by the jobs below. Linting
          # everything we ship or run is the point; luna/luna.lib/arc and vendor/ stay excluded
          # because they are vendored (see docs/coding-style.md).
          docker run --rm -v "$PWD":/app -w /app php:${{ matrix.php }}-cli sh -c '
            set -e
            find index.php luna/luna.php luna/luna.classes luna/luna.mods bin test \
              -name "*.php" -print0 | xargs -0 -n1 php -l'

  style:
    name: house style (php-cs-fixer + the project's own invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned dev tooling
        # tools/ carries its OWN composer manifest, deliberately separate from the root one:
        # the committed vendor/ tree is the deployment, and deps-audit.yml audits the root
        # lock file without --no-dev. See docs/coding-style.md.
        run: make tools
      - name: Assert the house style (PSR-12 + seven named deviations)
        run: make fmt-check
      - name: Assert the project's own invariants
        # Fold markers, the ontology namespace across 15 stylesheets + the R2RML mapping,
        # docs anchors, the module contract, and the ratchets.
        run: make lint-house

  analyse:
    name: PHPStan (no baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned dev tooling
        run: make tools
      - name: Static analysis
        run: make analyse

  compose-validate:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Docker stack definition
        run: docker compose config -q

  ports-loopback:
    name: ports are loopback-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any published port is not bound to 127.0.0.1
        run: |
          # Every published host port must be loopback-bound (see SECURITY.md).
          if grep -nE '^\s*-\s*"[0-9]+:[0-9]+"' docker-compose.yml; then
            echo "::error::Found a published port not bound to 127.0.0.1"; exit 1
          fi
          echo "OK: all published ports are 127.0.0.1-bound"

  regression:
    name: smoke + security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack (SQL reads; no triplestore needed)
        run: SPARQL_READS=0 docker compose up -d app db
      - name: Wait for the app to render seeded content
        run: |
          # Gate on real seeded content (the site footer), not just HTTP 200: the app answers a
          # degraded 200 while MySQL is still importing the seed. Combined with the db healthcheck +
          # `depends_on: service_healthy` in docker-compose.yml, this closes the readiness race.
          for i in $(seq 1 90); do
            curl -s http://localhost:8080/ 2>/dev/null | grep -q "Luna" && exit 0
            sleep 2
          done
          echo "::error::app did not render seeded content"; docker compose logs --tail=80; exit 1
      - name: Run the smoke + security-regression suite
        run: BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" bash test/regression.sh
      - name: Delegated-admin privilege-escalation guards
        # `make test` has always run all three suites; CI ran only the first. The two below are the
        # only coverage the WRITE path has (add/modify/delete through the admin mods), so leaving
        # them out of CI meant every gate in this workflow was a read-path gate.
        run: BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" bash test/delegated_admin.sh
      - name: Admin-lockout guardrails
        run: BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" bash test/admin_lockout.sh
      - name: Multilingual content
        # The one suite that exercises two languages at once. Everything else here runs on the
        # seed's single English row, which is exactly why the multilingual defects survived: with
        # one translation, a write path that clobbers every language and a read path that ignores
        # the requested one both look correct.
        run: BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" APP_CONTAINER="$(docker compose ps -q app)" bash test/multilingual.sh
      - name: Routing key vs display name
        run: BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" APP_CONTAINER="$(docker compose ps -q app)" bash test/naming_split.sh
      - name: Render-diff against the committed baseline
        # The output-neutrality gate: every page type is re-rendered and compared byte-for-byte
        # with test/render-baseline/, which is in the repo. This is what makes "the render is
        # unchanged" an assertion about the change rather than about one machine. A diff here is
        # information, not noise — inspect it, and if the new output is correct, re-capture with
        # `make render-capture` and commit the baseline alongside the change that moved it.
        run: BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" bash test/render_diff.sh check
      - name: Save what CI actually rendered (only when the render-diff failed)
        if: failure()
        run: |
          BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" \
            BASELINE_DIR=render-actual bash test/render_diff.sh capture || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-actual
          path: render-actual/
          if-no-files-found: ignore
