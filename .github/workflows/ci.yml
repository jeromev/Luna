name: CI

on:
  push:
    branches: [main, legacy]
  pull_request:

jobs:
  php-lint:
    name: PHP 8.3 lint (our code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: php -l across project code (vendored libs excluded)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli sh -c '
            set -e
            find index.php luna/luna.php luna/luna.classes luna/luna.mods \
              -name "*.php" -print0 | xargs -0 -n1 php -l'

  compose-validate:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Docker stack definition
        run: docker compose config -q

  ports-loopback:
    name: ports are loopback-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any published port is not bound to 127.0.0.1
        run: |
          # Every published host port must be loopback-bound (see SECURITY.md).
          if grep -nE '^\s*-\s*"[0-9]+:[0-9]+"' docker-compose.yml; then
            echo "::error::Found a published port not bound to 127.0.0.1"; exit 1
          fi
          echo "OK: all published ports are 127.0.0.1-bound"

  regression:
    name: smoke + security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack (SQL reads; no triplestore needed)
        run: SPARQL_READS=0 docker compose up -d app db
      - name: Wait for the app to render seeded content
        run: |
          # Gate on real seeded content (the site footer), not just HTTP 200: the app answers a
          # degraded 200 while MySQL is still importing the seed. Combined with the db healthcheck +
          # `depends_on: service_healthy` in docker-compose.yml, this closes the readiness race.
          for i in $(seq 1 90); do
            curl -s http://localhost:8080/ 2>/dev/null | grep -q "lunarSystem" && exit 0
            sleep 2
          done
          echo "::error::app did not render seeded content"; docker compose logs --tail=80; exit 1
      - name: Run the smoke + security-regression suite
        run: BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" bash test/regression.sh
      - name: Render-diff against the committed baseline
        # The output-neutrality gate: every page type is re-rendered and compared byte-for-byte
        # with test/render-baseline/, which is in the repo. This is what makes "the render is
        # unchanged" an assertion about the change rather than about one machine. A diff here is
        # information, not noise — inspect it, and if the new output is correct, re-capture with
        # `make render-capture` and commit the baseline alongside the change that moved it.
        run: BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" bash test/render_diff.sh check
      - name: Save what CI actually rendered (only when the render-diff failed)
        if: failure()
        run: |
          BASE=http://localhost:8080 DB_CONTAINER="$(docker compose ps -q db)" \
            BASELINE_DIR=render-actual bash test/render_diff.sh capture || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-actual
          path: render-actual/
          if-no-files-found: ignore
