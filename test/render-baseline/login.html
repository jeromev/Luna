  <body class="main">
    <div id="Page" class="login">
      <header id="Top">
        <h1>
          <a href="/">
            <span id="SiteTitle">My lunar Website</span>

        </h1>
        <h1>
          <a href="/login">Login</a>

      </header>
      <hr />
      <main id="Content">
        <div id="Content-main">
          <form method="post" action="/login">
            <div class="box">
              <fieldset id="Login">
                <h2 class="box-handle expanded">Connection form</h2>
                <div class="box-content">
                  <div class="fields">
                    <label for="email" class="">
                      <p class="label">Email</p>
                      <input name="email" id="email" type="text" value="" />
                    </label>
                    <label for="password" class="">
                      <p class="label">Password</p>
                      <input name="password" id="password" type="password" value="" />
                    </label>
                    <input type="hidden" name="last_url" value="" />
                  </div>
                  <div class="submit">
                    <input type="submit" class="submit" name="submit" />
                  </div>
                </div>
              </fieldset>
            </div>
            <input type="hidden" name="csrf_token" value="CSRF" />
          </form>
        </div>
        <div id="Bottom" class="box">
          <div class="box-content">
            <p>You are here: <a href="/login">/login</a><br />You are logged in as <strong>guest</strong> [<a href="/login">Login</a>] <br />Site powered by <a href="https://github.com/jeromev/LunarSystem">lunarSystem</a> VER</p>
          </div>
        </div>
      </main>
      <hr />
